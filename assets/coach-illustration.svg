<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" role="img" aria-labelledby="title desc">
  <title id="title">SMARTcoach-Gesundheitsfachkraft</title>
  <desc id="desc">Lächelnde Frau mit schulterlangem dunkeltürkisem Haar, weissem Kittel, grünem Oberteil und offener erklärender Hand. Eine Sprechblase zeigt drei Punkte.</desc>
  <defs>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#52c2b5"/><stop offset="1" stop-color="#078889"/></linearGradient>
    <linearGradient id="coat" x1="0" x2="0.9" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf9f7"/></linearGradient>
    <linearGradient id="wave" x1="0" x2="1"><stop stop-color="#b6eaf1"/><stop offset=".52" stop-color="#ddf7f1"/><stop offset="1" stop-color="#d7f0df"/></linearGradient>
  </defs>
  <!-- speech bubble and its three light accent strokes -->
  <g fill="none" stroke="#07545d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 55c42 0 73 26 73 59s-31 60-73 60c-11 0-22-2-31-6l-30 18 9-32c-13-10-21-24-21-40 0-33 32-59 73-59Z" fill="#fff" stroke-width="6"/>
    <path d="m319 31 3-19m18 27 14-17m5 35 18-12" stroke-width="7"/>
  </g>
  <g fill="#07545d"><circle cx="253" cy="114" r="7"/><circle cx="280" cy="114" r="7"/><circle cx="307" cy="114" r="7"/></g>
  <!-- back hair, face and neck -->
  <path d="M92 206c-16-53 1-110 42-138 28-20 69-23 100-5 31 18 48 52 43 94 25 26 28 67 19 112-8 43-29 68-54 77H104c-34-27-45-72-36-111 4-16 12-25 24-29Z" fill="#07545d"/>
  <path d="M129 185c0-50 27-83 71-83 43 0 72 34 72 84v50c0 52-30 87-72 87s-71-35-71-87Z" fill="#f3cbaa"/>
  <path d="M112 204c-11-65 13-124 66-143 51-18 104 10 111 64 4 28-5 56-18 77-15-6-26-22-30-47-24 24-63 39-112 39l-9 35Z" fill="#07545d"/>
  <path d="M129 203c-22 20-32 57-23 94l19 18m145-108c18 18 23 49 18 81l-17 24" fill="none" stroke="#07545d" stroke-linecap="round" stroke-width="14"/>
  <!-- friendly face -->
  <path d="M153 220q12-10 24 0m42 0q12-10 24 0" fill="none" stroke="#07545d" stroke-linecap="round" stroke-width="6"/>
  <path d="M169 230v12m60-12v12m-32 0-7 19 13 3" fill="none" stroke="#07545d" stroke-linecap="round" stroke-width="4"/>
  <path d="M181 274q17 15 35 0" fill="none" stroke="#07545d" stroke-linecap="round" stroke-width="6"/>
  <path d="M119 216c-20-5-30 9-27 25 2 13 12 21 25 18m158-42c20-4 30 9 27 25-2 12-11 19-24 18" fill="#f3cbaa"/>
  <!-- neck and white coat with green shirt -->
  <path d="M170 303h55v61c-14 18-39 18-55 0Z" fill="#f3cbaa"/>
  <path d="M93 364c20-24 47-39 78-50l27 36 28-37c33 12 62 28 78 53l27 115H58Z" fill="url(#coat)" stroke="#07545d" stroke-linejoin="round" stroke-width="6"/>
  <path d="m170 316 28 34-28 51-30-68Zm56-3-28 37 29 51 29-66Z" fill="#fff" stroke="#07545d" stroke-linejoin="round" stroke-width="5"/>
  <path d="m179 350 19 0 20 131h-62Z" fill="url(#shirt)"/>
