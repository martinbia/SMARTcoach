  <path d="M115 363c-33 8-50 27-63 58l-21 55c-5 13 7 19 17 9l27-34-17 44c-4 12 7 18 17 7l27-34-10 34c-3 11 8 15 16 6l33-42c10-12 15-29 19-48Z" fill="#f3cbaa" stroke="#07545d" stroke-linejoin="round" stroke-width="6"/>
  <path d="m154 376-35 104m78-127-25 68m-108 5 19 9m-4 28 18 5" fill="none" stroke="#07545d" stroke-linecap="round" stroke-width="4"/>
