<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245b51">
  <meta name="description" content="SMARTcoach – klickbare Tablet-Demo mit fiktiven Beispieldaten.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>SMARTcoach · Mein Weg</title>
  <script src="./demo-data.js" defer></script>
  <script src="./dashboard-data.js" defer></script>
  <script src="./idle-image.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Zum Inhalt</a>
  <div id="app"></div>
  <p id="storage-warning" class="notice" role="status" hidden>Ihre Einstellungen können gerade nicht dauerhaft gespeichert werden. Sie gelten nur, solange diese App geöffnet bleibt.</p>
  <p id="connection-status" class="connection" role="status"></p>
  <dialog id="confirmation" aria-labelledby="dialog-title">
    <div class="dialog-top"><span class="eyebrow">Sie entscheiden</span><button data-action="stop" class="stop">Beenden</button></div>
    <h2 id="dialog-title"></h2><div id="dialog-body"></div>
    <div class="dialog-actions" id="dialog-actions"></div>
  </dialog>
  <noscript>Bitte aktivieren Sie JavaScript, um das klickbare SMARTcoach-Mock-up zu verwenden.</noscript>
</body>
</html>
