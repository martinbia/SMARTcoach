name: Deploy PWA to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'demo-data.js'
      - 'dashboard-data.js'
      - 'content.js'
      - 'local-videos.js'
      - 'local-prompt-audio.js'
      - 'xray-media.js'
      - 'content/**'
      - 'idle-image.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect static app shell
        run: |
          mkdir _site
          cp index.html styles.css app.js demo-data.js dashboard-data.js idle-image.js content.js local-videos.js local-prompt-audio.js xray-media.js sw.js manifest.webmanifest .nojekyll _site/
          cp -r assets _site/assets
          cp -r content _site/content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
